openapi: 3.0.3
info:
  title: Txopela Tour API
  version: 1.0.0
  description: |-
    API REST da plataforma turística Txopela Tour — Inhambane, Moçambique.

    ## Autenticação

    Esta API utiliza tokens JWT. Após fazer login em `POST /api/auth/login/`, inclua o token no cabeçalho de cada pedido autenticado:

    ```
    Authorization: Bearer <token>
    ```

    ## Envelope de Resposta

    Todas as respostas seguem o formato padronizado:

    ```json
    {
      "status": "success",
      "code": 200,
      "data": { ... },
      "meta": { "timestamp": "...", "correlation_id": "..." }
    }
    ```

    ## Tokens

    O **access token** tem validade de **15 minutos**. Use `POST /api/auth/refresh/` com o `refreshToken` para obter um novo par antes da expiração.
  contact:
    name: Txopela Tour
    email: dev@txopelatour.mz
  license:
    name: Proprietary
paths:
  /api/admin/approvals/{id}/:
    put:
      operationId: admin_approvals_update
      description: |-
        Aprova ou rejeita um local ou serviço pendente pelo ID do item.

        O tipo é detectado automaticamente (local → service → post).

        - `action`: `approve` | `reject`
        - `reason`: motivo (obrigatório para rejeição)
      summary: Aprovar ou rejeitar item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Administração
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveItemRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApproveItemRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApproveItemRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveItemResponse'
            application/vnd.txopela.v1+json:
              schema:
                $ref: '#/components/schemas/ApproveItemResponse'
          description: ''
        '400':
          description: Dados inválidos
        '403':
          description: Sem permissão
        '404':
          description: Item não encontrado
