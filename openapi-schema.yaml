components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
    AdminStatsResponse:
      type: object
      properties:
        success:
          type: boolean
        stats:
          type: object
          additionalProperties: {}
      required:
      - stats
      - success
    AdminUserListResponse:
      type: object
      properties:
        success:
          type: boolean
        users:
          type: array
          items:
            type: object
            additionalProperties: {}
        pagination:
          type: object
          additionalProperties: {}
      required:
      - pagination
      - success
      - users
    ApproveItemRequestRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        reason:
          type: string
      required:
      - action
    ApproveItemResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        status:
          type: string
      required:
      - message
      - status
      - success
    AvatarUploadRequestRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
