          maximum: 5
          minimum: 1
        comment:
          type: string
          minLength: 1
      required:
      - comment
      - rating
    ServiceWriteCategoryEnum:
      enum:
      - transport
      - guide
      - accommodation
      - experience
      - equipment
      type: string
    ServiceWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        category:
          allOf:
          - $ref: '#/components/schemas/ServiceWriteCategoryEnum'
          default: experience
          description: transport | guide | accommodation | experience | equipment
        subcategory:
          type: string
        schedule:
          type: string
          description: 'Ex: Segunda a Sexta, 08:00–18:00'
        phone:
          type: string
          description: Número de telefone principal
        whatsapp:
          type: string
          description: Número WhatsApp (opcional)
        contact_email:
          type: string
          format: email
          description: Email de contacto (opcional)
        province:
          type: string
        municipality:
          type: string
          description: Distrito / Cidade
        address:
          type: string
          description: Endereço completo ou referência
        pricing:
          type: string
          description: 'JSON: {"type":"fixed","amount":100,"currency":"MZN","details":""}'
        availability:
          type: string
          description: 'JSON: {"isAvailable":true,"advanceBooking":0}'
        features:
          type: string
          description: 'JSON array: ["wifi","pickup"]'
        requirements:
          type: string
          description: 'JSON array: ["ID","swimsuit"]'
        images:
          type: array
          items:
            type: string
            format: binary
          maxItems: 20
      required:
      - description
      - title
    UnfollowResponse:
      type: object
      properties:
        success:
          type: boolean
        isFollowing:
          type: boolean
      required:
      - isFollowing
      - success
    UserProfile:
      type: object
      description: Serializer de edição do perfil (PUT/PATCH /api/auth/me).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          title: Utilizador
          description: Obrigatório. 150 carateres ou menos. Apenas letras, dígitos
            @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        phone:
          type: string
          maxLength: 20
        bio:
          type: string
        avatar:
          type: string
          format: uri
          nullable: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: pt
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - role
      - username
    UserProfileRequest:
      type: object
      description: Serializer de edição do perfil (PUT/PATCH /api/auth/me).
      properties:
        username:
          type: string
          minLength: 1
          title: Utilizador
          description: Obrigatório. 150 carateres ou menos. Apenas letras, dígitos
            @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        bio:
          type: string
        avatar:
          type: string
          format: binary
          nullable: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: pt
      required:
      - username
    UserRoleEnum:
      enum:
      - tourist
      - local_resident
      - local_business
      - guide
      - curator
      - admin
      type: string
    UserStatusRequestRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/UserStatusRequestStatusEnum'
        reason:
          type: string
      required:
      - status
    UserStatusRequestStatusEnum:
      enum:
      - active
      - suspended
      - banned
      type: string
    UserStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - message
      - success
    UserUpdateRequest:
      type: object
      description: Campos editáveis pelo usuário.
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          maxLength: 20
        dateOfBirth:
          type: string
          format: date
          nullable: true
        bio:
          type: string
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT — obtido via POST /api/auth/login/
