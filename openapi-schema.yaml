  /api/locals/geocode/:
    get:
      operationId: locals_geocode_retrieve
      description: |-
        Converte coordenadas GPS em endereço estruturado (província, distrito, localidade).

        O frontend usa este endpoint para preencher automaticamente o formulário de localização após o utilizador seleccionar o ponto no mapa. O utilizador confirma ou edita os dados antes de submeter.
      summary: Reverse geocoding — lat/lon → endereço
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: float
        description: 'Latitude (ex: -23.865)'
        required: true
      - in: query
        name: lon
        schema:
          type: number
          format: float
        description: 'Longitude (ex: 35.383)'
        required: true
